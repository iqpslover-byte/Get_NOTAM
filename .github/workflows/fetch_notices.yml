name: fetch-space-notices

# space-notices.com の打上げ関連通知（各国のNOTAM・航行警報）を差分取得し data/ をコミットする。
# 1回の実行では取りに行く件数に上限があるので、未取得が残っていれば次の実行で埋まる。
on:
  schedule:
    - cron: '43 * * * *'        # 毎時43分（他の Get_* と同じ毎時。分は重ならないようずらす）
  workflow_dispatch:
    inputs:
      max_fetch:
        description: '1回の実行で取りに行く上限件数'
        required: false
        default: '200'

permissions:
  contents: write
  issues: write        # 新しい通知のお知らせを Issue で出す（GitHub がメールを送る）

concurrency:
  group: fetch-space-notices
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch launch notices
        env:
          NOTICES_MAX_FETCH: ${{ github.event.inputs.max_fetch || '200' }}
          NOTICES_SLEEP: '0.6'
        run: python fetch_notices.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/notices.json data/_notices_cache.json data/_entries_cache.json
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "data: update launch notices ($(date -u +%FT%TZ))"
            git push
          fi

      # 新しい通知が出たら Issue を立てる。GitHub がメールとスマホ通知を送るので、
      # 自前のサーバも鍵も要らない。知らせるのが目的なので、立てたらすぐ閉じる。
      - name: Notify new notices
        if: ${{ hashFiles('_new_notices.md') != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title=$(head -1 _new_notices.md)
          tail -n +2 _new_notices.md > body.md
          echo "" >> body.md
          echo "@${{ github.repository_owner }}" >> body.md
          url=$(gh issue create --title "$title" --body-file body.md --label notice)
          echo "$url"
          gh issue close "$url" --comment "お知らせのみ（自動）"
