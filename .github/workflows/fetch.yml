name: fetch-space-tfr

# FAA tfr.faa.gov の SPACE OPERATIONS（打上げ空域）を定期取得し data/ をコミットする。
on:
  # 定期実行は停止（2026-09-23）。アプリは notices.json へ一本化したのでこのデータは読んでいない。
  # 戻すときは下の cron を有効にする。
  # schedule:
  #   - cron: '17 * * * *'
  workflow_dispatch:            # 手動実行だけ残す

permissions:
  contents: write

concurrency:
  group: fetch-space-tfr
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch SPACE OPERATIONS TFRs
        run: python fetch_notam.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/space_ops.json
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "data: update SPACE OPERATIONS TFRs ($(date -u +%FT%TZ))"
            git push
          fi
